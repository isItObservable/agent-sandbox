name: agent-sandbox — Fleet, Warm Pool & Isolation
type: dashboard
content:
  version: 21
  variables: []
  tiles:
    '0':
      type: markdown
      content: '# agent-sandbox — Fleet, Warm Pool & Isolation


        Kubernetes **agent-sandbox** v0.5.2 (`git_commit 9575043`) on cluster `agent-sandbox-demo`, sandboxes
        running under **gVisor** (`runsc`).


        agent-sandbox is the **mirror image of kagent**: it emits **Prometheus metrics + object-watch
        logs + pod logs, and no traces at all**. Every tile here is metric- or log-derived, never span-derived.
        Sources: controller `:8080/metrics`, `k8sobjects` CR watch, `kubeletstats`, `filelog`.


        All controller-runtime metrics are scoped with `k8s.cluster.name == "agent-sandbox-demo"` — the
        same tenant also ingests a CAPI management cluster that publishes identically-named `workqueue_*`
        and `controller_runtime_*` series.'
    '1':
      type: markdown
      content: '## ⭐ Warm-pool efficiency — the headline


        A `SandboxWarmPool` exists purely to remove cold-start latency. **Setting `spec.env` (or volume
        claim templates) on a `SandboxClaim` silently defeats it** — the env changes the effective pod
        template hash, no pooled sandbox matches, and the claim falls through to a cold create while the
        pool keeps costing full price.'
    '2':
      type: data
      title: Warm-pool hit rate (SandboxClaim)
      description: warm / (warm + cold) across all claim-owned sandboxes. A pool that is never adopted
        from reads 0%.
      query: 'timeseries { warm = avg(agent_sandboxes, default:0, filter: launch_type == "warm"), cold
        = avg(agent_sandboxes, default:0, filter: launch_type == "cold") }, filter: owned_by == "SandboxClaim"
        and k8s.cluster.name == "agent-sandbox-demo"

        | fieldsAdd w = arraySum(warm), c = arraySum(cold)

        | fieldsAdd hitRate = if(w + c > 0, 100.0 * w / (w + c), else: 0.0)

        | fields hitRate'
      visualization: singleValue
      visualizationSettings:
        thresholds: []
        singleValue:
          showLabel: true
          label: warm-pool hit rate %
          prefixIcon: ''
          recordField: hitRate
          autoscale: true
          alignment: center
          colorThresholdTarget: value
        unitsOverrides:
        - identifier: hitRate
          unitCategory: percentage
          baseUnit: percent
          displayUnit: null
          decimals: 1
          suffix: '%'
          delimiter: false
      querySettings: {}
    '3':
      type: data
      title: Warm-pool decision breakdown
      description: What the sandboxclaim controller actually decided, parsed from its structured JSON
        stdout. 'BYPASSED (custom config)' is the silent warm-pool killer.
      query: 'fetch logs

        | filter k8s.namespace.name == "agent-sandbox-system" and k8s.container.name == "agent-sandbox-controller"

        | parse content, "JSON:j"

        | fieldsAdd msg = j[msg]

        | filter in(msg, {"Successfully adopted sandbox from warm pool", "Bypassing warm pool adoption
        because custom configuration is provided (env or volume claim templates)", "creating sandbox from
        template"})

        | fieldsAdd decision = if(msg == "Successfully adopted sandbox from warm pool", "WARM HIT", else:
        if(msg == "Bypassing warm pool adoption because custom configuration is provided (env or volume
        claim templates)", "BYPASSED (custom config)", else: "COLD CREATE"))

        | summarize c = count(), by:{decision}

        | sort c desc'
      visualization: categoricalBarChart
      visualizationSettings:
        thresholds: []
        categoricalBarChart:
          categoryAxis:
          - decision
          valueAxis:
          - c
          categoryAxisLabel: decision
          valueAxisLabel: count
        unitsOverrides: []
      querySettings: {}
    '4':
      type: data
      title: Claim-owned sandboxes by launch type
      description: cold vs warm over time for SandboxClaim-owned sandboxes. A flat line at cold with zero
        warm is the failure mode.
      query: 'timeseries sb = avg(agent_sandboxes, default:0), by:{launch_type}, filter: owned_by == "SandboxClaim"
        and k8s.cluster.name == "agent-sandbox-demo"'
      visualization: areaChart
      visualizationSettings:
        thresholds: []
        chartSettings:
          gapPolicy: connect
          circleChartSettings:
            groupingThresholdType: relative
          categoryOverrides: {}
          categoricalBarChartSettings: {}
          hiddenLegendFields: []
        unitsOverrides: []
      querySettings: {}
    '5':
      type: data
      title: Per-claim warm-pool verdict (which claim got bypassed, and why)
      description: The proof tile. Each SandboxClaim and the decision the controller logged for it. Claims
        carrying spec.env appear as 'Bypassing warm pool adoption'; the env-free claim adopts a pooled
        sandbox.
      query: 'fetch logs

        | filter k8s.namespace.name == "agent-sandbox-system" and k8s.container.name == "agent-sandbox-controller"

        | parse content, "JSON:j"

        | fieldsAdd msg = j[msg], claim = j[name], ns = j[namespace]

        | filter msg == "Bypassing warm pool adoption because custom configuration is provided (env or
        volume claim templates)" or msg == "Successfully adopted sandbox from warm pool"

        | fieldsAdd verdict = if(msg == "Successfully adopted sandbox from warm pool", "WARM HIT", else:
        "BYPASSED — custom config (spec.env / volumeClaimTemplates)")

        | fields timestamp, ns, claim, verdict

        | sort timestamp desc

        | limit 50'
      visualization: table
      visualizationSettings:
        thresholds: []
        table:
          enableSparklines: false
          linewrapEnabled: false
        unitsOverrides: []
      querySettings: {}
    '6':
      type: markdown
      content: '## Fleet inventory


        `agent_sandboxes` is a point-in-time gauge whose label set encodes *how* each sandbox came to
        exist. Cardinality is bounded and safe (48 combinations per namespace × template) — no dimensional-explosion
        risk.'
    '7':
      type: data
      title: Sandbox inventory by owner and launch type
      description: 'The whole fleet: who owns each sandbox (None = hand-written, SandboxWarmPool = pooled
        member, SandboxClaim = claim-bound) and how it started.'
      query: 'timeseries sb = avg(agent_sandboxes, default:0), by:{owned_by, launch_type, sandbox_template},
        filter: k8s.cluster.name == "agent-sandbox-demo"'
      visualization: areaChart
      visualizationSettings:
        thresholds: []
        chartSettings:
          gapPolicy: connect
          circleChartSettings:
            groupingThresholdType: relative
          categoryOverrides: {}
          categoricalBarChartSettings: {}
          hiddenLegendFields: []
        unitsOverrides: []
      querySettings: {}
    '8':
      type: data
      title: Readiness — not-ready sandboxes
      description: Mirrors Sandbox.status.conditions[Ready]. A sustained ready_condition=false series
        is the alertable signal; a brief blip is a normal cold start or a suspend.
      query: 'timeseries sb = avg(agent_sandboxes, default:0), by:{ready_condition}, filter: k8s.cluster.name
        == "agent-sandbox-demo"'
      visualization: lineChart
      visualizationSettings:
        thresholds: []
        chartSettings:
          gapPolicy: connect
          circleChartSettings:
            groupingThresholdType: relative
          categoryOverrides: {}
          categoricalBarChartSettings: {}
          hiddenLegendFields: []
        unitsOverrides: []
      querySettings: {}
    '9':
      type: data
      title: Expired but still alive (reclamation leak)
      description: expired=true means the sandbox is past spec.shutdownTime. Anything non-zero here for
        long is a garbage-collection leak — you are paying for sandboxes that should be gone.
      query: 'timeseries sb = avg(agent_sandboxes, default:0), by:{expired}, filter: k8s.cluster.name
        == "agent-sandbox-demo"'
      visualization: lineChart
      visualizationSettings:
        thresholds: []
        chartSettings:
          gapPolicy: connect
          circleChartSettings:
            groupingThresholdType: relative
          categoryOverrides: {}
          categoricalBarChartSettings: {}
          hiddenLegendFields: []
        unitsOverrides: []
      querySettings: {}
    '10':
      type: markdown
      content: '## Controller health


        ⚠️ **`controller_runtime_reconcile_errors_total{controller="sandbox"}` is deliberately not charted
        as a health signal.** It has a permanent non-zero floor from a benign optimistic-concurrency race
        (`"the object has been modified"`) that self-heals on requeue. Charting it makes a healthy cluster
        look broken and alerting on it pages forever. **Use `workqueue_depth` for saturation instead**
        — it is the honest "is the controller keeping up" signal. The error stream is still shown below,
        as a triage surface rather than an alert source.'
    '11':
      type: data
      title: Workqueue depth (saturation) — the honest health signal
      description: Backlog per agent-sandbox controller. Sustained depth > 0 means reconciliation is falling
        behind. This, not reconcile_errors_total, is what to alert on.
      query: 'timeseries d = avg(workqueue_depth, default:0), by:{name}, filter: k8s.cluster.name == "agent-sandbox-demo"
        and in(name, {"sandbox", "sandboxclaim", "sandboxtemplate", "sandboxwarmpool"})'
      visualization: lineChart
      visualizationSettings:
        thresholds: []
        chartSettings:
          gapPolicy: connect
          circleChartSettings:
            groupingThresholdType: relative
          categoryOverrides: {}
          categoricalBarChartSettings: {}
          hiddenLegendFields: []
        unitsOverrides: []
      querySettings: {}
    '12':
      type: data
      title: Reconcile duration p95 by controller
      description: 95th percentile of per-interval average reconcile duration (rollup:avg — the Prometheus
        histogram is ingested as _bucket only, so this is a percentile of averages, not a true bucket
        quantile).
      query: 'timeseries p95 = percentile(controller_runtime_reconcile_time_seconds, 95, rollup: avg),
        by:{controller}, filter: k8s.cluster.name == "agent-sandbox-demo" and in(controller, {"sandbox",
        "sandboxclaim", "sandboxtemplate", "sandboxwarmpool"})'
      visualization: lineChart
      visualizationSettings:
        thresholds: []
        chartSettings:
          gapPolicy: connect
          circleChartSettings:
            groupingThresholdType: relative
          categoryOverrides: {}
          categoricalBarChartSettings: {}
          hiddenLegendFields: []
        unitsOverrides: []
      querySettings: {}
    '13':
      type: data
      title: Workqueue wait p95 by controller
      description: How long work sits queued before a worker picks it up. Rising wait with flat depth
        means worker starvation rather than backlog.
      query: 'timeseries q = percentile(workqueue_queue_duration_seconds, 95, rollup: avg), by:{name},
        filter: k8s.cluster.name == "agent-sandbox-demo" and in(name, {"sandbox", "sandboxclaim", "sandboxtemplate",
        "sandboxwarmpool"})'
      visualization: lineChart
      visualizationSettings:
        thresholds: []
        chartSettings:
          gapPolicy: connect
          circleChartSettings:
            groupingThresholdType: relative
          categoryOverrides: {}
          categoricalBarChartSettings: {}
          hiddenLegendFields: []
        unitsOverrides: []
      querySettings: {}
    '14':
      type: data
      title: Reconcile throughput by controller and result
      description: Sum of per-interval deltas over the selected window — not a cumulative gauge read,
        so it is reset-tolerant and cannot sawtooth. It does under-count by one interval per controller
        restart (see Counter validity below). The small, persistent 'sandbox / error' bar is the benign
        resource-version race — expect it to be non-zero on a perfectly healthy cluster.
      query: 'timeseries r = sum(controller_runtime_reconcile_total), by:{controller, result}, filter:
        k8s.cluster.name == "agent-sandbox-demo" and in(controller, {"sandbox", "sandboxclaim", "sandboxtemplate",
        "sandboxwarmpool"})

        | fieldsAdd total = arraySum(r)

        | filter total > 0

        | fields controller, result, total

        | sort total desc'
      visualization: categoricalBarChart
      visualizationSettings:
        thresholds: []
        categoricalBarChart:
          categoryAxis:
          - controller
          - result
          valueAxis:
          - total
          categoryAxisLabel: controller / result
          valueAxisLabel: reconciles
        unitsOverrides: []
      querySettings: {}
    '15':
      type: data
      title: Conversion webhook health (/convert)
      description: The v1alpha1 <-> v1beta1 conversion webhook. A failing /convert breaks every CRD API
        call, including kubectl get sandbox. Watch for any code other than 200.
      query: 'timeseries w = sum(controller_runtime_webhook_requests_total, default:0), by:{code, webhook},
        filter: k8s.cluster.name == "agent-sandbox-demo"'
      visualization: lineChart
      visualizationSettings:
        thresholds: []
        chartSettings:
          gapPolicy: connect
          circleChartSettings:
            groupingThresholdType: relative
          categoryOverrides: {}
          categoricalBarChartSettings: {}
          hiddenLegendFields: []
        unitsOverrides: []
      querySettings: {}
    '16':
      type: data
      title: Controller error log stream (triage, not alerting)
      description: Structured error records parsed from controller stdout. Expect a steady trickle of
        'Failed to update sandbox status' / 'Reconciler error' carrying 'the object has been modified'
        — that pair is the benign race, not an incident.
      query: 'fetch logs

        | filter k8s.namespace.name == "agent-sandbox-system" and k8s.container.name == "agent-sandbox-controller"

        | parse content, "JSON:j"

        | fieldsAdd lvl = j[level], msg = j[msg], ctrl = j[controller], err = j[error]

        | filter lvl == "error"

        | fields timestamp, ctrl, msg, err

        | sort timestamp desc

        | limit 50'
      visualization: table
      visualizationSettings:
        thresholds: []
        table:
          enableSparklines: false
          linewrapEnabled: false
        unitsOverrides: []
      querySettings: {}
    '17':
      type: markdown
      content: '## Sandbox resource usage — measured from *outside* the sandbox


        ⚠️ **`/proc` inside gVisor reports the HOST''s memory.** A pod with a 256 Mi limit reads `MemTotal:
        12248276 kB` — the node''s 12 GiB. Anything that self-reports resources from inside a sandbox
        (Python `psutil`, Node `os.totalmem()`, JVM ergonomics) is wrong, and a runtime that sizes its
        heap from `MemTotal` will size for 12 GiB inside a 256 Mi container and get OOM-killed.


        These two tiles come from **`kubeletstats` on the node DaemonSet** — outside the sandbox boundary,
        where the numbers are true. Compare the ~20–25 MiB working set below against the 12 GiB the sandbox
        believes it has.


        *Scoping note:* neither `kubeletstats` nor `k8sattributes` surfaces `runtimeClassName`, and the
        `agents.x-k8s.io/sandbox-name-hash` pod label appears in series metadata but is not usable as
        a `timeseries` split dimension. Sandbox pods are therefore scoped by namespace (`default`), which
        on this cluster contains exactly the sandbox pods.'
    '18':
      type: data
      title: Sandbox pod CPU (kubeletstats — outside the sandbox)
      query: 'timeseries cpu = avg(k8s.pod.cpu.usage), by:{k8s.pod.name}, filter: k8s.cluster.name ==
        "agent-sandbox-demo" and k8s.namespace.name == "default"'
      visualization: lineChart
      visualizationSettings:
        thresholds: []
        chartSettings:
          gapPolicy: connect
          circleChartSettings:
            groupingThresholdType: relative
          categoryOverrides: {}
          categoricalBarChartSettings: {}
          hiddenLegendFields: []
        unitsOverrides: []
      querySettings: {}
    '19':
      type: data
      title: Sandbox pod memory working set (truth, vs the 12 GiB /proc claims)
      query: 'timeseries mem = avg(k8s.pod.memory.working_set), by:{k8s.pod.name}, filter: k8s.cluster.name
        == "agent-sandbox-demo" and k8s.namespace.name == "default"'
      visualization: lineChart
      visualizationSettings:
        thresholds: []
        chartSettings:
          gapPolicy: connect
          circleChartSettings:
            groupingThresholdType: relative
          categoryOverrides: {}
          categoricalBarChartSettings: {}
          hiddenLegendFields: []
        unitsOverrides: []
      querySettings: {}
    '20':
      type: markdown
      content: '## Sandbox lifecycle stream


        **The agent-sandbox controller emits zero Kubernetes Events for its own CRDs** — `kubectl describe
        sandbox` shows no event history, and Dynatrace''s built-in Kubernetes event alerting is blind
        to sandbox lifecycle. The stream below is the compensating control: a `k8sobjects` receiver in
        **watch** mode over all four CRDs, with `managedFields` and `last-applied-configuration` stripped
        (3907 → 1084 bytes, 72% smaller) and the useful fields lifted into flat `agentsandbox.*` attributes
        so no JSON parsing is needed in DQL.'
    '21':
      type: data
      title: CR watch stream — Sandbox / SandboxClaim / SandboxTemplate / SandboxWarmPool
      description: Every create, modify and delete of an agent-sandbox custom resource. This is the only
        sandbox lifecycle history that exists, because the controller publishes no Events.
      query: 'fetch logs

        | filter k8s.cluster.name == "agent-sandbox-demo" and isNotNull(agentsandbox.kind) and agentsandbox.kind
        != "Event"

        | fields timestamp, agentsandbox.watch.type, agentsandbox.kind, agentsandbox.namespace, agentsandbox.name,
        agentsandbox.launch_type, agentsandbox.operating_mode, agentsandbox.ready_status, agentsandbox.ready_reason

        | sort timestamp desc

        | limit 50'
      visualization: table
      visualizationSettings:
        thresholds: []
        table:
          enableSparklines: false
          linewrapEnabled: false
        unitsOverrides: []
      querySettings: {}
    '22':
      type: markdown
      content: '## Counter validity — telling an agent-sandbox fault from an NFS artifact


        This cluster''s control-plane boot volume sits on shared NFS (etcd fsyncing over NFS, `/proc/pressure/io
        full avg300 ≈ 17%`), so probes flap and pods restart. These tiles exist so you can attribute a
        discontinuity *before* you believe it. Moving that volume off shared storage is the fix; it was
        deferred so this capture ran against the degraded cluster.


        **Measured against the 09:07:18Z controller restart, not assumed:**


        - `controller_runtime_*` and `workqueue_*` land in Grail as **delta** counters, not cumulative
        — a `timeseries sum(…)` bucket already holds the per-interval increment. **They cannot sawtooth.**
        The live series reads `39, 0, 16, 18, 8` per minute across the restart, never a monotone ramp.

        - The real reset artifact is the *opposite* of a spike: a **silent under-count**. The first post-restart
        scrape becomes the new delta baseline, so the controller''s start-up reconcile burst (7 reconciles
        after 09:07:18Z) is swallowed and never reaches Grail. Windowed totals read **low**, not jagged.

        - `agent_sandboxes` is a gauge recomputed from cluster state every scrape — unaffected. Every
        warm-pool and fleet tile above is reset-immune.


        **Which pods actually restart is the surprise:** `etcd` and `kube-apiserver` hold at **0**. The
        casualties are the leader-election clients that lose their lease when etcd stalls on fsync — `kube-controller-manager`,
        `kube-scheduler`, `kube-vip`. `agent-sandbox-controller` has restarted **once**. Read that ratio
        before blaming the operator.'
    '23':
      type: data
      title: Counter-reset boundaries — container restarts over time
      description: 'Every step in a line here is a point where the delta counters below lost their baseline.
        Overlay this mentally on the controller tiles: a discontinuity that lines up with a step is an
        infra artifact, one that does not is real signal. etcd/kube-apiserver stay flat at 0 — the NFS
        stall kills lease holders, not the datastore.'
      query: 'timeseries restarts = max(k8s.container.restarts), by:{k8s.container.name}, filter: k8s.cluster.name
        == "agent-sandbox-demo" and in(k8s.container.name, {"agent-sandbox-controller", "kube-apiserver",
        "etcd", "kube-controller-manager", "kube-scheduler", "kube-vip"})'
      visualization: lineChart
      visualizationSettings:
        thresholds: []
        chartSettings:
          gapPolicy: connect
          circleChartSettings:
            groupingThresholdType: relative
          categoryOverrides: {}
          categoricalBarChartSettings: {}
          hiddenLegendFields: []
        unitsOverrides: []
      querySettings: {}
    '24':
      type: data
      title: Restart league table — workload vs. control plane
      description: Peak restart count per container in the selected window. The agent-sandbox controller
        sitting at 1 while control-plane components sit in the twenties is the evidence that the instability
        is the NFS-backed boot volume, not the operator under test.
      query: 'timeseries rs = max(k8s.container.restarts), by:{k8s.namespace.name, k8s.pod.name, k8s.container.name},
        filter: k8s.cluster.name == "agent-sandbox-demo"

        | fieldsAdd restarts = arrayMax(rs)

        | filter restarts > 0

        | fields k8s.namespace.name, k8s.pod.name, k8s.container.name, restarts

        | sort restarts desc

        | limit 25'
      visualization: table
      visualizationSettings:
        thresholds: []
        table:
          enableSparklines: false
          linewrapEnabled: false
        unitsOverrides: []
      querySettings: {}
    '25':
      type: data
      title: Reconcile rate (reconciles/min) — reset-safe
      description: 'Explicit rate semantics: sum(..., rate: 1m). Because the counter is stored as a delta,
        a restart costs at most one interval of data — it can never produce a downward cliff or a ramp.
        Use this, not a cumulative total, whenever the controller may restart mid-window.'
      query: 'timeseries rpm = sum(controller_runtime_reconcile_total, rate: 1m, default: 0), by:{controller,
        result}, filter: k8s.cluster.name == "agent-sandbox-demo" and in(controller, {"sandbox", "sandboxclaim",
        "sandboxtemplate", "sandboxwarmpool"})'
      visualization: lineChart
      visualizationSettings:
        thresholds: []
        chartSettings:
          gapPolicy: connect
          circleChartSettings:
            groupingThresholdType: relative
          categoryOverrides: {}
          categoricalBarChartSettings: {}
          hiddenLegendFields: []
        unitsOverrides: []
      querySettings: {}
