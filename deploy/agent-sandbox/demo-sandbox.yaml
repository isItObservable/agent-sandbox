# agent-sandbox demo — a real OpenClaw agent Sandbox running under gVisor
# ============================================================================
# Proves the episode's core claim end to end: a real agent runtime (OpenClaw,
# a Node.js gateway) executing inside the gVisor userspace kernel rather than
# sharing the host kernel.
#
# API: agents.x-k8s.io/v1beta1 (agent-sandbox v0.5.2).
# `service: true` makes the controller front the sandbox pod with a headless
# Service so a router / client SDK can reach the agent on :18789.
#
# Config lives in the ConfigMap and credentials in the Secret so that this same
# pod spec can be lifted verbatim into a SandboxTemplate — which is what makes
# warm-pool adoption possible (see TUTORIAL.md §9a). Do NOT move these into a
# per-claim `spec.env`: that silently drops warm-pool hit rate to 0%.
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: default
  labels:
    app: demo-agent
data:
  # bind: "lan" is required for the Service to reach the gateway. OpenClaw
  # defaults to loopback-only, which works with `kubectl port-forward` and
  # nothing else. A non-loopback bind REQUIRES auth to be configured.
  #
  # dangerouslyDisableDeviceAuth — DEMO-ONLY break-glass. Browsers treat
  # plain-http://<lan-ip> as a non-secure context and block WebCrypto, so the
  # Control UI cannot perform device-identity auth from a LAN browser, and
  # `allowInsecureAuth` does NOT help (it is loopback-only). This flag skips
  # the device-identity check; token auth stays mandatory. It is a documented
  # severe downgrade — keep it on a disposable sandbox, and REMOVE it after
  # the demo (`openclaw security audit` warns while it is on). The proper fix
  # is HTTPS in front of the gateway. See TUTORIAL.md "Access the Control UI".
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": "lan",
        "port": 18789,
        "auth": { "mode": "token" },
        "controlUi": {
          "allowedOrigins": ["http://10.20.30.20:18789"],
          "dangerouslyDisableDeviceAuth": true
        }
      },
      "models": {
        "providers": {
          "ollama": {
            "baseUrl": "http://ollama.default.svc.cluster.local:11434",
            "apiKey": "ollama-local",
            "api": "ollama",
            "timeoutSeconds": 300,
            "models": [
              {
                "id": "qwen3.6:latest",
                "name": "qwen3.6:latest",
                "input": ["text"],
                "contextWindow": 131072,
                "params": { "num_ctx": 131072, "keep_alive": "15m", "thinking": false }
              }
            ]
          }
        }
      },
      "agents": {
        "defaults": {
          "workspace": "/workspace/agent",
          "model": { "primary": "ollama/qwen3.6:latest" },
          "thinkingDefault": "off"
        }
      }
    }
  AGENTS.md: |
    # Demo agent
    You are a demo agent running inside a gVisor-isolated Kubernetes sandbox.
    Keep answers short.
---
apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: demo-agent
  namespace: default
  labels:
    app: demo-agent
spec:
  operatingMode: Running
  # Retain so the sandbox survives for telemetry capture.
  shutdownPolicy: Retain
  service: true
  podTemplate:
    metadata:
      # These labels land on the POD (verified live), which is what makes a
      # legible Service selector possible. The controller only ever stamps
      # `agents.x-k8s.io/sandbox-name-hash=<opaque>` -- see openclaw-ui-service.yaml.
      labels:
        app: openclaw
        role: ui
    spec:
      # THE POINT OF THE DEMO: run the agent under the gVisor sandbox runtime.
      runtimeClassName: gvisor
      containers:
        - name: agent
          image: ghcr.io/openclaw/openclaw:slim
          # The openclaw:slim image already runs as uid 1000 (node); we declare
          # it explicitly and drop every capability so the sandbox pod is
          # least-privilege on paper as well as in practice. No fsGroup is
          # needed -- /workspace is an emptyDir writable by uid 1000.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: gateway
              containerPort: 18789
          env:
            # The image's default HOME is /home/node, which is on the read-only
            # image layer. Point HOME and the state dir at the writable volume.
            - name: HOME
              value: /workspace
            - name: OPENCLAW_CONFIG_PATH
              value: /etc/openclaw/openclaw.json
            - name: OPENCLAW_STATE_DIR
              value: /workspace/state
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: OPENCLAW_GATEWAY_TOKEN
            # Ollama over the LAN. "ollama-local" is OpenClaw's marker for an
            # unauthenticated local/LAN daemon -- it is not a credential. The
            # real endpoint lives in ollama-endpoint.yaml, so repointing the
            # model backend never touches this ConfigMap and never restarts
            # the warm pool.
            - name: OLLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: OLLAMA_API_KEY
          volumeMounts:
            - name: config
              mountPath: /etc/openclaw
              readOnly: true
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
          # WITHOUT this probe the Sandbox reports Ready ~14s before OpenClaw can
          # actually serve a request (pod-ready 8s vs gateway-ready 22s, measured).
          # A warm pool would hand out members that are not yet serving.
          readinessProbe:
            httpGet:
              path: /
              port: 18789
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            # ALWAYS set a memory limit under gVisor. With no limit, /proc/meminfo
            # inside the sandbox reports the HOST's memory and Node sizes its heap
            # for a machine it does not have (measured: 11.68 GiB / 2240 MB heap,
            # versus 1 GiB / 560 MB with this limit in place). See TUTORIAL.md §9b.
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: openclaw-config
        - name: workspace
          emptyDir: {}
        - name: tmp
          emptyDir: {}
