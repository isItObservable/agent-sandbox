# The workspace volume — the ONE storage value you set per environment
# ============================================================================
# DO NOT kubectl apply this file unchanged: it ships a documentation
# placeholder (`__STORAGE_CLASS_NAME__`). Substitute your cluster's
# StorageClass first — TUTORIAL.md Step 7 shows the one-line sed; applied
# as-is, the PVCs stay Pending forever and the pool never warms, with no
# Kubernetes signal naming the cause.
# ============================================================================
# Warm-pooling a REAL agent image — the Step 7 / §9a demonstration
# ============================================================================
# The lifecycle driver uses a tiny image so the state space is quick to
# exercise. This file does the same thing with the actual OpenClaw agent, and
# is what proves the episode's central claim: a warm pool still adopts when the
# agent needs config and credentials.
#
# THE RULE: everything the agent needs to be born configured lives HERE, in the
# SandboxTemplate. The claims below are deliberately empty. Move any of it into
# a claim's `spec.env` or `spec.volumeClaimTemplates` and the controller logs
# "Bypassing warm pool adoption..." and cold-starts instead — see TUTORIAL.md §9a.
#
# Requires the `openclaw-secrets` Secret and `openclaw-config` ConfigMap from
# demo-sandbox.yaml, so apply that first.
#
# PERSISTENT STATE: the workspace volume is a TEMPLATE-level
# `spec.volumeClaimTemplates` entry, so the controller provisions one PVC PER
# pool member (StatefulSet-style) and warm-pool adoption still works. It needs
# a StorageClass in the cluster — set via the STORAGE_CLASS_NAME env var at
# apply time (the demo cluster uses `nfs-csi`). See TUTORIAL.md §7 for the
# full trade-off.
# ============================================================================
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: openclaw-tpl
  namespace: default
spec:
  envVarsInjectionPolicy: Allowed
  # Allowed = claims MAY declare their own volumeClaimTemplates (which bypasses
  # the warm pool — the trap below). The template's own templates below are
  # always honoured; this policy only gates claim-level overrides.
  volumeClaimTemplatesPolicy: Allowed
  # Provisioned PER pool member, StatefulSet-style — this is the warm-pool-safe
  # way to give pooled agents persistent state. A per-CLAIM volume (like a
  # per-claim `spec.env`) is what bypasses the pool and forces a cold start.
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        # Substituted at apply time from STORAGE_CLASS_NAME — see the header.
        storageClassName: __STORAGE_CLASS_NAME__
        resources:
          requests:
            storage: 2Gi
  podTemplate:
    metadata:
      # `app: openclaw` is the stable handle the egress policy selects on. Do
      # NOT select pooled pods by `sandbox-template-ref-hash`: that hash changes
      # every time the template changes, silently orphaning the policy.
      labels:
        app: openclaw
    spec:
      # fsGroup 1000 makes the provisioned PVC writable by the agent's uid — a
      # freshly provisioned CSI volume is root-owned otherwise. Not needed for
      # emptyDir, REQUIRED for volumeClaimTemplates with runAsNonRoot.
      securityContext:
        fsGroup: 1000
      # THE SECOND HALF OF THE MODEL-BACKEND TRAP. A template-derived sandbox is
      # born with `dnsPolicy: None` and `nameservers: [8.8.8.8, 1.1.1.1]` --
      # public resolvers only, cluster DNS not in the list. So EVERY in-cluster
      # Service name is NXDOMAIN from a pooled sandbox, including the one this
      # agent needs for its model backend. A bare `Sandbox` gets ClusterFirst and
      # resolves fine, which is why this only breaks after you move to the pool.
      # Verified: `ollama.default.svc.cluster.local` -> ENOTFOUND without this line.
      dnsPolicy: ClusterFirst
      runtimeClassName: gvisor
      containers:
        - name: agent
          # Pinned to the same live-verified build as demo-sandbox.yaml — the
          # Control-UI break-glass flag in the shared config is version-
          # dependent, and the floating `:slim` tag no longer serves the
          # A/B-proven image. See demo-sandbox.yaml for the full note.
          image: ghcr.io/openclaw/openclaw:2026.6.34@sha256:47d342bafe83bd3b2dca6f1d8d8b608ba7b542a1952564960648943346206759
          # The openclaw:slim image already runs as uid 1000 (node); we declare
          # it explicitly and drop every capability so pooled members are
          # least-privilege on paper as well as in practice. The pod-level
          # fsGroup (1000) above is what keeps the PVC-backed /workspace
          # writable for this uid.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: gateway
              containerPort: 18789
          env:
            - name: HOME
              value: /workspace
            - name: OPENCLAW_CONFIG_PATH
              value: /etc/openclaw/openclaw.json
            - name: OPENCLAW_STATE_DIR
              value: /workspace/state
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: OPENCLAW_GATEWAY_TOKEN
            # Ollama over the LAN. "ollama-local" is OpenClaw's marker for an
            # unauthenticated local/LAN daemon -- it is not a credential. The
            # real endpoint lives in ollama-endpoint.yaml, so repointing the
            # model backend never touches this ConfigMap and never restarts
            # the warm pool.
            - name: OLLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: OLLAMA_API_KEY
          volumeMounts:
            - name: config
              mountPath: /etc/openclaw
              readOnly: true
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
          # Without this, pool members report Ready ~14s before the gateway can
          # serve — so a claim can adopt a member that refuses its first request.
          readinessProbe:
            httpGet:
              path: /
              port: 18789
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            # Under gVisor the limit is what makes /proc honest. See §9b.
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: openclaw-config
        # There is NO `workspace` entry here on purpose: the volumeMount above
        # resolves the name `workspace` against the template-level
        # `spec.volumeClaimTemplates`, exactly like a StatefulSet. Defining a
        # pod volume with the same name would shadow the claim.
        - name: tmp
          emptyDir: {}
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: openclaw-pool
  namespace: default
spec:
  replicas: 2
  sandboxTemplateRef:
    name: openclaw-tpl
---
# THE GOOD CLAIM — nothing but a pool reference. Adopts a warm member.
# Measured: time-to-ready −86 s (Ready before the claim existed).
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxClaim
metadata:
  name: oc-claim-warm
  namespace: default
spec:
  warmPoolRef:
    name: openclaw-pool
---
# THE TRAP — one env var, and the pool is bypassed entirely.
# Measured: time-to-ready +6 s (cold create from the template).
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxClaim
metadata:
  name: oc-claim-env
  namespace: default
spec:
  warmPoolRef:
    name: openclaw-pool
  env:
    - name: OPENCLAW_SESSION_ID
      value: "user-42"
