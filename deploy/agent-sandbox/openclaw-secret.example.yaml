# Copy to openclaw-secret.yaml, fill in, and apply. Do NOT commit the filled copy.
#
# OpenClaw requires at least ONE model-provider key. This demo uses self-hosted
# Ollama, whose key is not a credential at all: for a local/LAN daemon OpenClaw
# expects the literal marker `ollama-local`. It is here only because the gateway
# wants a provider configured. (A hosted backend would use ANTHROPIC_API_KEY |
# GEMINI_API_KEY | OPENAI_API_KEY | OPENROUTER_API_KEY instead, and then this
# really is a secret.)
#
# OPENCLAW_GATEWAY_TOKEN authenticates callers to the gateway. It is mandatory
# because openclaw.json binds to a non-loopback address — and once
# openclaw-ui-service.yaml publishes the gateway, it is the only thing standing
# between the LAN and a sandbox that executes code. Generate a real one:
#
#   kubectl create secret generic openclaw-secrets \
#     --from-literal=OLLAMA_API_KEY=ollama-local \
#     --from-literal=OPENCLAW_GATEWAY_TOKEN="$(openssl rand -hex 32)"
#
# Verify it is enforced before trusting it: an unauthenticated GET of the
# LoadBalancer address must return 401, not 200.
apiVersion: v1
kind: Secret
metadata:
  name: openclaw-secrets
  namespace: default
type: Opaque
stringData:
  OLLAMA_API_KEY: ollama-local
  OPENCLAW_GATEWAY_TOKEN: REPLACE_ME
