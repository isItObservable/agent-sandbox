# Copy to openclaw-secret.yaml, fill in, and apply. Do NOT commit the filled copy.
# OpenClaw requires at least ONE model-provider key:
#   ANTHROPIC_API_KEY | GEMINI_API_KEY | OPENAI_API_KEY | OPENROUTER_API_KEY
# OPENCLAW_GATEWAY_TOKEN authenticates callers to the gateway. It is mandatory
# because openclaw.json binds to a non-loopback address.
apiVersion: v1
kind: Secret
metadata:
  name: openclaw-secrets
  namespace: default
type: Opaque
stringData:
  ANTHROPIC_API_KEY: REPLACE_ME
  OPENCLAW_GATEWAY_TOKEN: REPLACE_ME
