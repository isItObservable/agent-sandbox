# Template only — DO NOT COMMIT A FILLED-IN COPY.
#
# Two secrets are needed, both in namespace `dynatrace` / `observability`:
#
#  1. `agent-sandbox-demo` (ns dynatrace)      — used by the DynaKube (ActiveGate)
#       apiToken          : Dynatrace API token, scopes:
#                             - Create ActiveGate tokens
#                             - Read entities / Read settings / Write settings
#                             - Access problem and event feed, metrics and topology
#                             - Read configuration / Write configuration
#       dataIngestToken   : data-ingest token, scopes:
#                             - metrics.ingest
#                             - logs.ingest
#                             - openTelemetryTrace.ingest
#
#  2. `dynatrace-otlp` (ns observability)      — used by BOTH OTel Collectors
#       dataIngestToken   : the SAME data-ingest token as above
#
# Create them from the CLI instead of committing YAML:
#
#   kubectl create namespace dynatrace
#   kubectl create secret generic agent-sandbox-demo -n dynatrace \
#     --from-literal=apiToken="${DT_OPERATOR_TOKEN}" \
#     --from-literal=dataIngestToken="${DT_INGEST_TOKEN}"
#
#   kubectl create namespace observability
#   kubectl create secret generic dynatrace-otlp -n observability \
#     --from-literal=dataIngestToken="${DT_INGEST_TOKEN}"
#
# Then set your tenant URL in the two Collector CRs and in the DynaKube:
#   https://<your-tenant>.live.dynatrace.com/api
---
apiVersion: v1
kind: Secret
metadata:
  name: agent-sandbox-demo
  namespace: dynatrace
type: Opaque
stringData:
  apiToken: "dt0c01.REPLACE_ME"
  dataIngestToken: "dt0c01.REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: dynatrace-otlp
  namespace: observability
type: Opaque
stringData:
  dataIngestToken: "dt0c01.REPLACE_ME"
